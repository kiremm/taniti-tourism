<main class="page">

  <!-- MAIN NAVIGATION -->
  <header class="site-header">

  <h1 class="logo">TANITI</h1>

  <nav class="main-nav" aria-label="Main navigation">
    <button
      type="button"
      class="nav-link active"
    >
      Explore
    </button>
  </nav>

  <div class="header-actions">

    <button
      type="button"
      class="icon-button"
      aria-label="Search Taniti"
    >
      🔍
    </button>

    <button
      type="button"
      class="passport-button"
    >
      Passport
    </button>

    <button
      type="button"
      class="icon-button"
      aria-label="Open menu"
    >
      ☰
    </button>

  </div>

</header>


  <!-- FULL-SCREEN MAP -->
  <section
    class="map-shell"
    aria-label="Explore Taniti"
  >

    <!-- CATEGORY CONTROLS -->
    <div class="map-categories">

      <button type="button">
        Food
      </button>

      <button type="button">
        Experiences
      </button>

      <button type="button">
        Transport
      </button>

      <button type="button">
        Stay
      </button>

      <button type="button">
        Essentials
      </button>

    </div>


    <!-- MAP -->
    <svg
      #mapSvg
      class="taniti-map"
      [attr.viewBox]="viewBox"
      preserveAspectRatio="xMidYMid meet"

      role="img"
      aria-label="Interactive conceptual map of Taniti"

      (wheel)="onWheel($event)"

      (pointerdown)="startPan($event)"
      (pointermove)="panMap($event)"
      (pointerup)="endPan($event)"
      (pointercancel)="endPan($event)"
    >

      <!-- TANITI / BIG ISLAND BASE -->
      <path
        class="island-base"
        d="
          m 59.142552,40.710427
          -0.376,0.377
          -0.754,-0.565
          -1.883,-0.753
          -0.379,-0.566
          -0.188,-0.376
          0.188,-3.014
          -1.318,-3.203
          -0.754,-0.752
          -0.565,-0.753
          0.189,-0.567
          1.13,-1.129
          1.318,-1.694
          0,-0.753
          -0.941,-1.319
          -0.189,-0.753
          0.189,-0.755
          0.376,-0.188
          1.131,0.188
          0.376,0.565
          1.696,0.755
          2.073,0.376
          2.26,0.943
          1.507,0.941
          0.753,0.941
          0.188,1.508
          0.941,-0.189
          0.377,0.563
          0,0.755
          0.942,0.753
          1.318,0.564
          -0.377,0.754
          -2.071,1.883
          -1.695,0.944
          -1.507,0.188
          -1.695,1.317
          -0.941,0.564
          -1.319,2.45
          Z
        "
      ></path>

    </svg>


    <!-- COMPASS -->
    <div class="compass" aria-hidden="true">
      <span>▲</span>
      <small>N</small>
    </div>


    <!-- ZOOM CONTROLS -->
    <div
      class="zoom-controls"
      aria-label="Map controls"
    >

      <button
        type="button"
        aria-label="Zoom in"
        (click)="zoomIn()"
      >
        +
      </button>

      <button
        type="button"
        aria-label="Zoom out"
        (click)="zoomOut()"
      >
        −
      </button>

      <button
        type="button"
        aria-label="Reset map"
        (click)="resetMap()"
        class="reset-button"
      >
        ⌂
      </button>

    </div>


    <!-- MAP DISCLAIMER -->
    <p class="map-note">
      Conceptual map using Hawaii as Taniti
    </p>

  </section>

</main>
